camera:
  device_id: 0
  width: 640
  height: 480
  sample_interval_sec: 0.05

pose:
  model: thunder
  min_visibility: 0.05

posture:
  head_pitch_threshold_deg: 22.0
  torso_angle_threshold_deg: 15.0
  bad_duration_sec: 60
  normal_restore_delay_sec: 300

actuator:
  enabled: true
  port: /dev/ttyACM0
  baudrate: 9600
  heartbeat_interval_sec: 2.0
  status_interval_sec: 1.0
  response_timeout_sec: 10.0
  reconnect_interval_sec: 2.0
